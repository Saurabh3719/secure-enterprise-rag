[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "secure-enterprise-rag"
version = "0.1.0"
description = "Permission-aware enterprise retrieval-augmented generation"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "argon2-cffi>=23.1,<26",
]

[project.optional-dependencies]
data = [
    "huggingface-hub>=0.23,<1",
    "urllib3>=1.26,<2; python_version < '3.10'",
]

[tool.setuptools.packages.find]
where = ["src"]

